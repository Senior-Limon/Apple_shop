<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4b5563;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.2s;
            outline: none;
            background: white;
        }

        input:focus, select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .phone-group {
            display: flex;
            gap: 10px;
        }

        .phone-group select {
            width: 140px;
        }

        .phone-group input {
            flex: 1;
        }

        .btn-register {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-register:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 14px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .form-hint {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            color: #9ca3af;
        }

        .error-message {
            color: #dc2626;
            font-size: 12px;
            margin-top: 5px;
        }

        .input-error {
            border-color: #dc2626 !important;
            background-color: #fef2f2 !important;
        }

        .input-valid {
            border-color: #10b981 !important;
        }
    </style>
</head>
<body>

<div class="register-container">
    <h1>📝 Регистрация</h1>

    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

    <form th:action="@{/register}" method="post" id="registerForm">
        <div class="form-group">
            <label>ФИО</label>
            <input type="text"
                   name="fullName"
                   id="fullName"
                   th:value="${fullName}"
                   required
                   placeholder="Иванов Иван Иванович">
            <span class="form-hint">Введите полное имя</span>
        </div>

        <div class="form-group">
            <label>Телефон</label>
            <div class="phone-group">
                <select id="countryCode" name="countryCode" th:value="${countryCode}">
                    <option value="BY">🇧🇾 Беларусь (+375)</option>
                    <option value="RU">🇷🇺 Россия (+7)</option>
                    <option value="PL">🇵🇱 Польша (+48)</option>
                    <option value="LT">🇱🇹 Литва (+370)</option>
                    <option value="LV">🇱🇻 Латвия (+371)</option>
                    <option value="KZ">🇰🇿 Казахстан (+7)</option>
                </select>
                <input type="tel"
                       id="phoneNumber"
                       name="phoneNumber"
                       th:value="${phoneNumber}"
                       required
                       placeholder="XX XXX XXXX">
            </div>
            <span class="form-hint" id="phoneHint">Для Беларуси: 29 123 4567 или 33 123 4567</span>
            <span id="phoneError" class="error-message"></span>
        </div>

        <div class="form-group">
            <label>Пароль</label>
            <input type="password" name="password" id="password" required minlength="6">
            <span class="form-hint">Минимум 6 символов</span>
        </div>

        <div class="form-group">
            <label>Подтверждение пароля</label>
            <input type="password" name="confirmPassword" id="confirmPassword" required>
            <span id="passwordError" class="error-message"></span>
        </div>

        <button type="submit" class="btn-register">Зарегистрироваться</button>
    </form>

    <div class="login-link">
        Уже есть аккаунт? <a href="/login">Войти</a>
    </div>
</div>

<script>
    const countrySelect = document.getElementById('countryCode');
    const phoneInput = document.getElementById('phoneNumber');
    const phoneHint = document.getElementById('phoneHint');
    const phoneError = document.getElementById('phoneError');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirmPassword');
    const passwordErrorSpan = document.getElementById('passwordError');

    // Маски для каждой страны
    const phoneMasks = {
        BY: { regex: /^(29|33|44|25)\d{7}$/, example: '291234567', hint: 'Для Беларуси: 29, 33, 44 или 25 + 7 цифр (всего 9 цифр после кода)' },
        RU: { regex: /^9\d{9}$/, example: '9123456789', hint: 'Для России: 10 цифр, начинается с 9' },
        PL: { regex: /^\d{9}$/, example: '123456789', hint: 'Для Польши: 9 цифр' },
        LT: { regex: /^6\d{7}$/, example: '61234567', hint: 'Для Литвы: 8 цифр, начинается с 6' },
        LV: { regex: /^2\d{7}$/, example: '21234567', hint: 'Для Латвии: 8 цифр, начинается с 2' },
        KZ: { regex: /^7\d{9}$/, example: '7771234567', hint: 'Для Казахстана: 10 цифр, начинается с 7' }
    };

    // Обновление подсказки
    function updatePhoneHint() {
        const country = countrySelect.value;
        const mask = phoneMasks[country];
        if (mask) {
            phoneHint.textContent = mask.hint;
            phoneHint.style.color = '#9ca3af';
        }
        // Не очищаем значение номера!
    }

    // Валидация телефона (не очищает поле!)
    function validatePhone() {
        const country = countrySelect.value;
        const phone = phoneInput.value.replace(/\s/g, '');
        const mask = phoneMasks[country];

        if (phone.length === 0) {
            phoneInput.classList.remove('input-error', 'input-valid');
            phoneError.textContent = '';
            return false;
        }

        if (mask && !mask.regex.test(phone)) {
            phoneInput.classList.add('input-error');
            phoneInput.classList.remove('input-valid');
            phoneError.textContent = `❌ Неверный формат. Пример: ${mask.example}`;
            return false;
        } else {
            phoneInput.classList.remove('input-error');
            phoneInput.classList.add('input-valid');
            phoneError.textContent = '✓ Номер корректный';
            phoneError.style.color = '#10b981';
            return true;
        }
    }

    // Валидация пароля
    function validatePassword() {
        const password = passwordInput.value;
        const confirm = confirmInput.value;

        if (password.length > 0 && password.length < 6) {
            passwordErrorSpan.textContent = 'Пароль должен быть минимум 6 символов';
            passwordErrorSpan.style.color = '#dc2626';
            return false;
        } else if (password !== confirm && confirm.length > 0) {
            passwordErrorSpan.textContent = 'Пароли не совпадают';
            passwordErrorSpan.style.color = '#dc2626';
            return false;
        } else if (password === confirm && password.length >= 6 && confirm.length >= 6) {
            passwordErrorSpan.textContent = '✓ Пароли совпадают';
            passwordErrorSpan.style.color = '#10b981';
            return true;
        } else {
            passwordErrorSpan.textContent = '';
            return false;
        }
    }

    // Сброс ошибки при смене пароля
    function resetPasswordError() {
        if (passwordInput.value === confirmInput.value && passwordInput.value.length >= 6) {
            passwordErrorSpan.textContent = '✓ Пароли совпадают';
            passwordErrorSpan.style.color = '#10b981';
        } else if (passwordInput.value !== confirmInput.value && confirmInput.value.length > 0) {
            passwordErrorSpan.textContent = 'Пароли не совпадают';
            passwordErrorSpan.style.color = '#dc2626';
        } else {
            passwordErrorSpan.textContent = '';
        }
    }

    // Обработчики событий
    countrySelect.addEventListener('change', () => {
        updatePhoneHint();
        validatePhone();
    });

    phoneInput.addEventListener('input', validatePhone);
    phoneInput.addEventListener('blur', validatePhone);

    passwordInput.addEventListener('input', () => {
        validatePassword();
        resetPasswordError();
    });
    confirmInput.addEventListener('input', () => {
        validatePassword();
        resetPasswordError();
    });

    // Валидация перед отправкой
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        const isPhoneValid = validatePhone();
        const isPasswordValid = validatePassword();

        if (!isPhoneValid || !isPasswordValid) {
            e.preventDefault();
            if (!isPhoneValid) {
                phoneError.textContent = 'Пожалуйста, введите корректный номер телефона';
                phoneError.style.color = '#dc2626';
            }
            if (!isPasswordValid) {
                passwordErrorSpan.textContent = 'Пожалуйста, проверьте пароль';
                passwordErrorSpan.style.color = '#dc2626';
            }
        }
    });

    // Инициализация при загрузке
    updatePhoneHint();

    // Если есть сохранённые данные, проверяем их
    if (phoneInput.value) {
        validatePhone();
    }
</script>

</body>
</html>
